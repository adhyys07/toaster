name: Build Toaster

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # setup-msys2 does not put MINGW64 on the PATH of other shells, so
          # every build step below declares `shell: msys2 {0}` explicitly.
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p package
          cp build/emu.exe README.md package/
          cp -r assets package/assets
          # SDL2_ttf pulls in freetype and harfbuzz, which pull in more again.
          # Walking ldd is the only reliable way to catch the whole chain; a
          # hand-written list goes stale and the archive then fails to start.
          ldd build/emu.exe build/*.dll \
            | awk '$3 ~ /mingw64/ { print $3 }' \
            | sort -u \
            | while read -r dll; do cp -v "$dll" package/; done
          ls -l package
      - name: Archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive package toaster-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: toaster-windows.zip
