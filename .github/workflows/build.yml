name: Build Toaster

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # setup-msys2 does not put MINGW64 on the PATH of other shells, so
          # every build step below declares `shell: msys2 {0}` explicitly.
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-curl
            mingw-w64-x86_64-python
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      # CPack and the install rules are the single packaging path, so the
      # archive published here is byte-for-byte what a local
      # "cpack -G ZIP" produces. The previous hand-rolled copy step was a
      # second path that could drift, and did: v0.1.0 shipped without the
      # MinGW runtime DLLs and would not start.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd build && cpack -G ZIP
          unzip -l toaster-windows-x64.zip | tail -5

      # The reviewer who caught the missing DLLs did this by hand. Stripping
      # the toolchain off PATH makes any unpackaged DLL fail to resolve, and
      # because Windows binds imports before main() runs, --help exiting zero
      # proves every one of them is present.
      - name: Verify the archive starts without the toolchain
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          Expand-Archive build/toaster-windows-x64.zip `
                         -DestinationPath verify -Force
          $exe = Get-ChildItem verify -Recurse -Filter emu.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "emu.exe is not in the archive" }

          & $exe.FullName --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "emu.exe exited $LASTEXITCODE with a clean PATH; a DLL is missing from the archive"
          }
          Write-Output "The archive starts with no toolchain on PATH."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/toaster-windows-x64.zip
