name: Build Toaster

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/emu.exe package/
          Copy-Item build/SDL2.dll package/
          Copy-Item build/SDL2_ttf.dll package/
          Copy-Item -Recurse assets package/assets
          Copy-Item README.md package/

      - name: Archive
        run: Compress-Archive package toaster-windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: toaster-windows.zip